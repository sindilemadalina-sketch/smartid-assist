<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>SmartID Assist</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Roboto',sans-serif;
  background:
    linear-gradient(rgba(240,242,250,.95), rgba(240,242,250,.95)),
    url("logo.png");
  background-size:500px;
  background-position:center 150px;
  background-repeat:no-repeat;
  background-attachment:fixed;
}

.loginPage{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.loginBox{
  background:white;
  padding:40px;
  border-radius:25px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
  text-align:center;
}

.loginBox h1{
  font-size:40px;
  margin:0;
  color:#4c1d95;
}

input{
  padding:12px;
  margin:10px;
  width:250px;
}

button{
  padding:12px;
  background:#6d28d9;
  color:white;
  border:none;
  border-radius:10px;
}

.app{display:none}

.hero{
  text-align:center;
  padding:60px;
}

.hero h1{
  font-size:50px;
  color:#4c1d95;
}

.hero p{
  font-size:18px;
  color:#555;
}

.search input{
  padding:15px;
  width:350px;
  border-radius:12px;
}

.container{
  padding:30px;
}

.filters{
  text-align:center;
  margin:20px;
}

.filter{
  padding:10px 15px;
  margin:5px;
  background:#ddd;
  border-radius:20px;
  cursor:pointer;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:15px;
  padding:10px;
  cursor:pointer;
}

.card video{
  width:100%;
}

.popup{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
}

.popupContent{
  background:white;
  max-width:800px;
  margin:50px auto;
  padding:20px;
  border-radius:15px;
}

textarea{
  width:100%;
  height:80px;
}
</style>
</head>

<body>

<div class="loginPage" id="loginPage">
  <div class="loginBox">
    <h1>SmartID Assist</h1>
    <p>Ghid de utilizare echipamente NCR</p>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Parolă">
    <br>
    <button onclick="login()">Login</button>
    <p id="err" style="color:red;"></p>
  </div>
</div>

<div class="app" id="app">

<div class="hero">
  <h1>SmartID Assist</h1>
  <p>Ghid de utilizare echipamente NCR</p>

  <div class="search">
    <input id="search" placeholder="Caută după tag..." oninput="loadItems()">
  </div>
</div>

<div class="filters">
  <span class="filter" onclick="setCategory('carrefour')">Carrefour</span>
  <span class="filter" onclick="setCategory('franciza')">Franciză</span>
</div>

<div class="container">
  <div class="cards" id="cards"></div>
</div>

</div>

<div class="popup" id="popup">
  <div class="popupContent">
    <h2 id="title"></h2>
    <video id="video" controls></video>

    <p>
      <button onclick="like()">👍 <span id="l">0</span></button>
      <button onclick="dislike()">👎 <span id="d">0</span></button>
    </p>

    <textarea id="c"></textarea>
    <button onclick="comment()">Comentariu</button>
    <button onclick="closePopup()">Închide</button>

    <div id="comments"></div>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, updateDoc, doc, increment, query, where } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDyRr9PKvwsZ7QonqFuDFjRShVR8NqN16k",
  authDomain: "smart-id-assist.firebaseapp.com",
  projectId: "smart-id-assist",
  storageBucket: "smart-id-assist.firebasestorage.app",
  messagingSenderId: "812376610238",
  appId: "1:812376610238:web:aaa03b4bd1c7bfd22c55ef"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);

let cat="";
let current="";

window.login = async function(){
  try{
    await signInWithEmailAndPassword(auth,email.value,password.value);
    loginPage.style.display="none";
    app.style.display="block";
    loadItems();
  }catch{
    err.innerText="Login greșit";
  }
}

window.setCategory=function(c){cat=c;loadItems();}

window.loadItems = async function(){
  const s = search.value.toLowerCase();
  const snap = await getDocs(collection(db,"videos"));
  let html="";
  snap.forEach(d=>{
    const v=d.data();
    if(cat && v.category!=cat) return;
    if(s && !v.tags.includes(s)) return;
    html+=`
    <div class="card" onclick="openItem('${d.id}','${v.title}','${v.url}',${v.likes||0},${v.dislikes||0})">
      <video src="${v.url}"></video>
      <h3>${v.title}</h3>
      <p>${v.tags}</p>
    </div>`;
  });
  cards.innerHTML=html;
}

window.openItem=function(id,t,u,l,dv){
  current=id;
  title.innerText=t;
  video.src=u;
  lspan=l;
  dspan=dv;
  popup.style.display="block";
  loadComments();
}

window.closePopup=function(){popup.style.display="none";}

window.like=async function(){
  await updateDoc(doc(db,"videos",current),{likes:increment(1)});
}

window.dislike=async function(){
  await updateDoc(doc(db,"videos",current),{dislikes:increment(1)});
}

window.comment=async function(){
  await addDoc(collection(db,"comments"),{videoId:current,text:c.value});
  c.value="";
  loadComments();
}

async function loadComments(){
  const q=query(collection(db,"comments"),where("videoId","==",current));
  const snap=await getDocs(q);
  let h="";
  snap.forEach(d=>h+=`<div>${d.data().text}</div>`);
  comments.innerHTML=h;
}

</script>

</body>
</html>
