<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>SmartID Assist</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #16001f;
      color: white;
    }

    .header {
      background: linear-gradient(90deg, #3b005c, #7b1fa2);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      width: 45px;
      height: 45px;
      background: white;
      border-radius: 8px;
    }

    h1 {
      margin: 0;
    }

    .section {
      padding: 20px;
    }

    .category {
      font-size: 22px;
      margin-bottom: 10px;
      border-left: 5px solid #b45cff;
      padding-left: 10px;
    }

    .sub {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .sub div {
      background: #2c003d;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    .row {
      display: flex;
      gap: 15px;
      overflow-x: auto;
    }

    .card {
      min-width: 250px;
      background: #250033;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    video {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .title {
      padding: 10px;
    }

    .popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
    }

    .popup-content {
      background: #240033;
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
      border-radius: 10px;
    }

    textarea {
      width: 100%;
      height: 70px;
      margin-top: 10px;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      background: #9c27b0;
      color: white;
      border: none;
    }

  </style>
</head>

<body>

<div class="header">
  <img src="logo.png" class="logo">
  <h1>SmartID Assist</h1>
</div>

<!-- PROCEDURI -->
<div class="section">
  <div class="category">PROCEDURI</div>

  <div class="sub">
    <div>Carrefour Franciză</div>
    <div>Carrefour</div>
    <div>Hipermarket</div>
    <div>Supermarket</div>
    <div>Express</div>
  </div>

  <div class="row">
    <div class="card" onclick="openPopup('Restart NCR','videos/restart.mp4')">
      <video src="videos/restart.mp4"></video>
      <div class="title">Restart echipament</div>
    </div>
  </div>
</div>

<!-- VIDEOCLIPURI -->
<div class="section">
  <div class="category">VIDEOCLIPURI</div>

  <div class="sub">
    <div>Carrefour Franciză</div>
    <div>Carrefour</div>
    <div>Hipermarket</div>
    <div>Supermarket</div>
    <div>Express</div>
  </div>

  <div class="row">
    <div class="card" onclick="openPopup('Utilizare NCR','videos/restart.mp4')">
      <video src="videos/restart.mp4"></video>
      <div class="title">Utilizare echipament</div>
    </div>
  </div>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-content" id="popupContent"></div>
</div>

<script>
function openPopup(title, video){
  document.getElementById("popupContent").innerHTML = `
    <h2>${title}</h2>

    <video controls src="${video}" style="width:100%"></video>

    <p>Urmează pașii din video.</p>

    <textarea placeholder="Lasă feedback..."></textarea>
    <br>
    <button onclick="closePopup()">Închide</button>
  `;

  document.getElementById("popup").style.display = "block";
}

function closePopup(){
  document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
