<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>SmartID Assist</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #14001f;
  color: white;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  background: #1d002b;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo img {
  width: 40px;
}

.nav a {
  margin-left: 20px;
  color: #d1a3ff;
  text-decoration: none;
}

/* HERO */
.hero {
  padding: 60px 40px;
  background: linear-gradient(90deg, #3b005c, #7b1fa2);
}

.hero h1 {
  margin: 0;
  font-size: 40px;
}

.hero p {
  margin-top: 10px;
  font-size: 18px;
}

/* SECTION */
.section {
  padding: 30px 40px;
}

.section h2 {
  border-left: 5px solid #b45cff;
  padding-left: 10px;
}

/* SUBCATEGORIES */
.sub {
  margin: 15px 0;
}

.sub button {
  background: #2c003d;
  border: none;
  color: white;
  padding: 10px 15px;
  margin-right: 10px;
  border-radius: 10px;
  cursor: pointer;
}

.sub button:hover {
  background: #7b1fa2;
}

/* CARDS */
.row {
  display: flex;
  gap: 15px;
  overflow-x: auto;
}

.card {
  min-width: 250px;
  background: #250033;
  border-radius: 12px;
  cursor: pointer;
}

.card video {
  width: 100%;
}

.title {
  padding: 10px;
}

/* POPUP */
.popup {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
}

.popup-content {
  background: #240033;
  max-width: 700px;
  margin: 50px auto;
  padding: 20px;
  border-radius: 10px;
}

textarea {
  width: 100%;
  height: 70px;
}

button {
  margin-top: 10px;
  padding: 10px;
  background: #9c27b0;
  border: none;
  color: white;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <img src="logo.png">
    <b>SmartID Assist</b>
  </div>

  <div class="nav">
    <a href="#">Proceduri</a>
    <a href="#">Videoclipuri</a>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <h1>SmartID Assist</h1>
  <p>Platformă pentru proceduri și utilizarea echipamentelor NCR</p>
</div>

<!-- PROCEDURI -->
<div class="section">
  <h2>PROCEDURI</h2>

  <div class="sub">
    <button>Carrefour Franciză</button>
    <button>Carrefour</button>
    <button>Hipermarket</button>
    <button>Supermarket</button>
    <button>Express</button>
  </div>

  <div class="row">
    <div class="card" onclick="openPopup('Restart NCR','videos/restart.mp4')">
      <video src="videos/restart.mp4"></video>
      <div class="title">Restart echipament</div>
    </div>
  </div>
</div>

<!-- VIDEO -->
<div class="section">
  <h2>VIDEOCLIPURI</h2>

  <div class="sub">
    <button>Carrefour Franciză</button>
    <button>Carrefour</button>
    <button>Hipermarket</button>
    <button>Supermarket</button>
    <button>Express</button>
  </div>

  <div class="row">
    <div class="card" onclick="openPopup('Utilizare NCR','videos/restart.mp4')">
      <video src="videos/restart.mp4"></video>
      <div class="title">Utilizare echipament</div>
    </div>
  </div>
</div>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-content" id="popupContent"></div>
</div>

<script>
function openPopup(title, video){
  document.getElementById("popupContent").innerHTML = `
    <h2>${title}</h2>
    <video controls src="${video}" style="width:100%"></video>

    <p>Urmează pașii din video.</p>

    <textarea placeholder="Feedback..."></textarea>
    <br>
    <button onclick="closePopup()">Închide</button>
  `;
  document.getElementById("popup").style.display = "block";
}

function closePopup(){
  document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
