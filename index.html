<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartID Hub PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Inter;
background:linear-gradient(135deg,#f3e8ff,#fff);
}

.hidden{display:none}

.topbar{
display:flex;
justify-content:space-between;
padding:15px 25px;
background:white;
box-shadow:0 5px 20px rgba(0,0,0,0.05);
}

.sidebar{
position:fixed;
left:-300px;
top:0;
width:260px;
height:100%;
background:#0b0b1f;
color:white;
padding:20px;
transition:0.3s;
z-index:10;
}

.sidebar.open{left:0}

.menuBtn{
position:fixed;
left:0;
top:100px;
background:black;
color:white;
padding:12px;
border-radius:0 10px 10px 0;
cursor:pointer;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
cursor:pointer;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
transition:0.2s;
}
.card:hover{transform:scale(1.03)}

.viewer{
position:fixed;
inset:0;
background:white;
display:none;
flex-direction:column;
}

.viewer iframe{
flex:1;
width:100%;
border:none;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:15px;
}

.tab{
padding:10px 15px;
border-radius:10px;
cursor:pointer;
background:#eee;
}

.tab.active{
background:purple;
color:white;
}

</style>
</head>

<body>

<div class="topbar">
<b>SmartID Hub</b>
</div>

<div class="menuBtn" onclick="toggleMenu()">☰</div>

<div class="sidebar" id="menu">
<h3>Meniu</h3>

<button onclick="openDashboard()">Dashboard</button><br><br>
<button onclick="openVideos()">Videoclipuri</button><br><br>
<button onclick="openProcedures()">Proceduri</button><br><br>
<button onclick="openAdd()">Adaugă material</button><br><br>
<button onclick="openReports()">Rapoarte</button>

</div>

<!-- DASHBOARD -->
<div id="dashboard">

<div style="padding:20px">

<h2>Dashboard</h2>

<div class="grid">
<div class="card">Loginuri</div>
<div class="card">Useri</div>
<div class="card">Vizualizări video</div>
<div class="card">Vizualizări proceduri</div>
</div>

<div style="margin-top:30px">
<h3>Diagramă</h3>
<div style="width:200px;height:200px;border-radius:50%;background:conic-gradient(purple 60%,pink 40%)"></div>
</div>

</div>

</div>

<!-- VIDEOS -->
<div id="videos" class="hidden">
<div class="grid" id="videoList"></div>
</div>

<!-- PROCEDURES -->
<div id="procedures" class="hidden">
<div class="grid" id="procList"></div>
</div>

<!-- ADD -->
<div id="add" class="hidden">

<div style="padding:20px">

<h2>Adaugă material</h2>

<div class="tabs">
<div class="tab active" onclick="selectTab('video')" id="tabVideo">Video</div>
<div class="tab" onclick="selectTab('proc')" id="tabProc">Procedură</div>
</div>

<input id="title" placeholder="Titlu"><br><br>
<input id="url" placeholder="Link"><br><br>

<button onclick="add()">Adaugă</button>

</div>

</div>

<!-- VIEWER -->
<div class="viewer" id="viewer">
<button onclick="closeViewer()">← Înapoi</button>
<iframe id="frame"></iframe>
</div>

<script>
let type="video"

function toggleMenu(){
menu.classList.toggle("open")
}

function hideAll(){
dashboard.classList.add("hidden")
videos.classList.add("hidden")
procedures.classList.add("hidden")
add.classList.add("hidden")
}

function openDashboard(){hideAll();dashboard.classList.remove("hidden")}
function openVideos(){hideAll();videos.classList.remove("hidden");loadVideos()}
function openProcedures(){hideAll();procedures.classList.remove("hidden");loadProcedures()}
function openAdd(){hideAll();add.classList.remove("hidden")}

function selectTab(t){
type=t
tabVideo.classList.remove("active")
tabProc.classList.remove("active")
if(t==="video") tabVideo.classList.add("active")
else tabProc.classList.add("active")
}

function loadVideos(){
videoList.innerHTML=""
for(let i=0;i<5;i++){
videoList.innerHTML+=`<div class="card" onclick="openViewer('https://www.youtube.com/embed/dQw4w9WgXcQ')">Video ${i}</div>`
}
}

function loadProcedures(){
procList.innerHTML=""
for(let i=0;i<5;i++){
procList.innerHTML+=`<div class="card" onclick="openViewer('https://drive.google.com/file/d/1/view')">Procedura ${i}</div>`
}
}
function openViewer(url){
viewer.style.display="flex"
frame.src=url
}

function closeViewer(){
viewer.style.display="none"
frame.src=""
}

function add(){
alert("Material adăugat: " + type)
}

function openReports(){
hideAll()
alert("Rapoarte: aici vom pune export CSV, materiale utile, useri activi și magazine active.")
}

openDashboard()
</script>

</body>
</html>
