<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SmartID Assist</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Roboto';
  margin:0;
  background:#f5f6fa;
}

.header{
  text-align:center;
  padding:30px;
}

h1{
  font-size:42px;
}

.login{
  text-align:center;
  margin-top:40px;
}

input{
  padding:10px;
  margin:5px;
}

button{
  padding:10px;
  background:#6d28d9;
  color:white;
  border:none;
}

.main{
  display:none;
  padding:30px;
}

.search{
  text-align:center;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:15px;
  margin:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="header">
  <h1>SmartID Assist</h1>
</div>

<div class="login">
  <input id="email" placeholder="email">
  <input id="pass" type="password" placeholder="parola">
  <br>
  <button onclick="login()">Login</button>
</div>

<div class="main" id="main">

  <div class="search">
    <input id="search" placeholder="Caută după tag..." oninput="loadVideos()">
  </div>

  <div id="videos"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDyRr9PKvwsZ7QonqFuDFjRShVR8NqN16k",
  authDomain: "smart-id-assist.firebaseapp.com",
  projectId: "smart-id-assist",
  storageBucket: "smart-id-assist.firebasestorage.app",
  messagingSenderId: "812376610238",
  appId: "1:812376610238:web:aaa03b4bd1c7bfd22c55ef"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.login = async function(){
  const email = document.getElementById("email").value;
  const pass = document.getElementById("pass").value;

  await signInWithEmailAndPassword(auth,email,pass);

  document.querySelector(".login").style.display="none";
  document.getElementById("main").style.display="block";

  loadVideos();
}

window.loadVideos = async function(){

  const search = document.getElementById("search").value.toLowerCase();

  const snapshot = await getDocs(collection(db,"videos"));

  let html="";

  snapshot.forEach(doc=>{
    const v = doc.data();

    if(search && !v.tags.includes(search)) return;

    html += `
      <div class="card">
        <h3>${v.title}</h3>
        <video controls width="300" src="${v.url}"></video>
        <p>Tag: ${v.tags}</p>

        <button onclick="like('${doc.id}')">👍</button>
        <button onclick="dislike('${doc.id}')">👎</button>

        <br><br>
        <input id="c${doc.id}" placeholder="comentariu">
        <button onclick="comment('${doc.id}')">Trimite</button>
      </div>
    `;
  });

  document.getElementById("videos").innerHTML = html;
}

window.like = function(id){
  alert("like salvat (demo)");
}

window.dislike = function(id){
  alert("dislike salvat (demo)");
}

window.comment = async function(id){
  const text = document.getElementById("c"+id).value;

  await addDoc(collection(db,"comments"),{
    videoId:id,
    text:text
  });

  alert("comentariu salvat");
}

</script>

</body>
</html>
